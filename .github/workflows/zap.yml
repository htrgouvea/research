name: DAST - OWASP ZAP

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-full-scan-production
  cancel-in-progress: false

jobs:
  zap-scan:
    name: Production scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run ZAP Full Scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c
        with:
          target: "https://heitorgouvea.me/"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          artifact_name: "zap-full-scan"
          allow_issue_writing: false
          fail_action: true
          cmd_options: >-
            -m 5
            -T 10
            -l WARN
            -s
            --hook=/zap/wrk/.zap/hooks.py
            -z "-config scanner.threadPerHost=2
            -config scanner.maxRuleDurationInMins=2
            -config scanner.maxScanDurationInMins=20
            -config scanner.maxAlertsPerRule=20
            -config scanner.pluginHeader=true
            -config spider.parseSitemapXml=true
            -config spider.parseRobotsTxt=true
            -config spider.processform=false
            -config spider.postform=false
            -config connection.timeoutInSecs=60"
